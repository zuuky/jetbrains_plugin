[project]
name = "sweep-autocomplete"
version = "0.1.0"
description = "Sweep Autocomplete Server using llama-cpp-python"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "httptools>=0.6.0",
    "loguru>=0.7.0",
    "requests>=2.31.0",
    "regex>=2023.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "brotli>=1.1.0",
    "openai>=1.0.0",
    "distro>=1.8.0",
    "jiter>=0.0.0",
    "sniffio>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sweep_autocomplete"]

[tool.hatch.build.targets.sdist]
include = [
    "/sweep_autocomplete",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
